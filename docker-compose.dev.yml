version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bulir-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: bulir_reservas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bulir_reservas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

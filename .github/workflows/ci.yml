name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint:check

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" "prisma/**/*.ts"

      - name: Type-check and compile
        run: npm run build

  test:
    name: Unit, integration & e2e tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bulir_reservas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Já termina em _test: o global setup dos testes migra e limpa esta BD.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bulir_reservas_test?schema=public
      JWT_ACCESS_SECRET: test_access_secret_at_least_8_chars
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: test_refresh_secret_at_least_8_chars
      JWT_REFRESH_EXPIRATION: 7d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit tests with coverage thresholds
        run: npm run test:cov

      - name: Integration tests (concurrency against PostgreSQL)
        run: npm run test:integration

      - name: End-to-end tests (HTTP against PostgreSQL)
        run: npm run test:e2e

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          tags: bulir-reservas-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Produção local: corre a mesma imagem que vai para o deploy (Dockerfile.prod)
# com um PostgreSQL ao lado, para validar a imagem antes de a publicar.
#
#   JWT_ACCESS_SECRET=... JWT_REFRESH_SECRET=... POSTGRES_PASSWORD=... \
#     docker compose up -d --build --wait
#
# (ou `npm run docker:smoke`, que gera segredos, sobe tudo e testa com curl).
name: bulir-reservas-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: bulir-reservas-api:local
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bulir}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bulir_reservas}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    # Sistema de ficheiros só de leitura: a aplicação não escreve em disco.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sem porta publicada: só a API (rede interna do compose) chega à BD.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bulir_reservas}
      POSTGRES_USER: ${POSTGRES_USER:-bulir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_prod:
